<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ChatBACK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0b;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 700px;
      margin: auto;
      background: #111;
    }

    /* HEADER */

    .header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: #171717;
      border-bottom: 1px solid #292929;
    }

    .back {
      font-size: 25px;
      margin-right: 14px;
      cursor: pointer;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4d8d, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      margin-right: 12px;
    }

    .person-info {
      flex: 1;
    }

    .person-name {
      font-size: 17px;
      font-weight: 700;
    }

    .status {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 2px;
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px 30px;
      background:
        radial-gradient(circle at top, #181818, #0b0b0b 55%);
    }

    .date {
      text-align: center;
      margin: 8px auto 20px;
      width: fit-content;
      padding: 6px 12px;
      border-radius: 12px;
      background: #202020;
      color: #aaa;
      font-size: 11px;
    }

    .message {
      max-width: 78%;
      padding: 10px 13px;
      margin: 7px 0;
      border-radius: 15px;
      line-height: 1.4;
      font-size: 15px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #075e54;
      border-bottom-right-radius: 4px;
    }

    .ai {
      margin-right: auto;
      background: #242424;
      border-bottom-left-radius: 4px;
    }

    .time {
      display: block;
      text-align: right;
      font-size: 9px;
      color: #aaa;
      margin-top: 4px;
    }

    .typing {
      display: none;
      width: fit-content;
      background: #242424;
      padding: 10px 14px;
      border-radius: 15px;
      margin: 8px 0;
      color: #aaa;
      font-size: 13px;
    }

    /* INPUT */

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #171717;
      border-top: 1px solid #292929;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: #252525;
      color: white;
      border-radius: 22px;
      padding: 12px 16px;
      font-size: 15px;
      min-height: 44px;
      max-height: 100px;
    }

    textarea::placeholder {
      color: #777;
    }

    button {
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: #ff3b81;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .app {
        width: 100%;
      }

      .message {
        max-width: 84%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div class="back" onclick="goBack()">
      ‹
    </div>

    <div class="avatar" id="avatar">
      ?
    </div>

    <div class="person-info">
      <div class="person-name" id="personName">
        Chat
      </div>

      <div class="status">
        ChatBACK AI
      </div>
    </div>

  </div>


  <!-- CHAT -->

  <div class="chat" id="chat">

    <div class="date">
      ChatBACK
    </div>

    <div class="message ai">

      Hey 👋

      <br><br>

      You can talk to me here. I'll respond based on the communication patterns from the uploaded chat.

      <span class="time">
        now
      </span>

    </div>

    <div class="typing" id="typing">
      typing...
    </div>

  </div>


  <!-- INPUT -->

  <div class="input-area">

    <textarea
      id="messageInput"
      placeholder="Type a message..."
      rows="1"
    ></textarea>

    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      ➤
    </button>

  </div>

</div>


<script>

  // ---------------------------------------
  // GET NAME
  // ---------------------------------------

  const params = new URLSearchParams(
    window.location.search
  );

  const personName =
    params.get("name") || "Chat";

  document.getElementById(
    "personName"
  ).textContent = personName;


  document.getElementById(
    "avatar"
  ).textContent =
    personName.charAt(0).toUpperCase();


  // ---------------------------------------
  // CHAT ELEMENTS
  // ---------------------------------------

  const chat =
    document.getElementById("chat");

  const input =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const typing =
    document.getElementById("typing");


  // ---------------------------------------
  // ADD MESSAGE
  // ---------------------------------------

  function addMessage(
    text,
    type
  ) {

    const message =
      document.createElement("div");

    message.className =
      `message ${type}`;

    message.textContent = text;

    const time =
      document.createElement("span");

    time.className = "time";

    time.textContent = "now";

    message.appendChild(time);

    chat.insertBefore(
      message,
      typing
    );

    chat.scrollTop =
      chat.scrollHeight;
  }


  // ---------------------------------------
  // SEND MESSAGE
  // ---------------------------------------

  async function sendMessage() {

    const message =
      input.value.trim();

    if (!message) return;

    addMessage(
      message,
      "user"
    );

    input.value = "";

    sendButton.disabled = true;

    typing.style.display = "block";

    chat.scrollTop =
      chat.scrollHeight;


    try {

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              message: message,

              personName:
                personName

            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data?.error ||
          "AI request failed."
        );

      }


      typing.style.display =
        "none";


      addMessage(
        data.reply,
        "ai"
      );


    } catch (error) {

      typing.style.display =
        "none";

      addMessage(
        "Sorry, something went wrong. Please try again.",
        "ai"
      );

      console.error(error);

    }


    sendButton.disabled = false;

    input.focus();

  }


  // ---------------------------------------
  // ENTER TO SEND
  // ---------------------------------------

  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  // ---------------------------------------
  // BACK
  // ---------------------------------------

  function goBack() {

    window.history.back();

  }

</script>

</body>
</html>
